openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Pharmacy POS API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication & session management
  - name: users
    description: User & staff management
  - name: branches
    description: Branch / multi-location management
  - name: medicines
    description: Medicine / drug master
  - name: inventory
    description: Inventory management
  - name: patients
    description: Patient / customer management
  - name: prescriptions
    description: Prescription management
  - name: sales
    description: Point of sale / billing
  - name: suppliers
    description: Supplier & vendor management
  - name: dashboard
    description: Dashboard & KPIs

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── AUTH ──────────────────────────────────────────────────
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutInput"
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get current user profile
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  # ── USERS ──────────────────────────────────────────────────
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List users
      parameters:
        - name: role
          in: query
          schema:
            type: string
        - name: branch_id
          in: query
          schema:
            type: string
        - name: is_active
          in: query
          schema:
            type: boolean
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"
    post:
      operationId: createUser
      tags: [users]
      summary: Create user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{user_id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get user
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    put:
      operationId: updateUser
      tags: [users]
      summary: Update user
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{user_id}/status:
    patch:
      operationId: updateUserStatus
      tags: [users]
      summary: Activate / deactivate user
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserStatusUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  # ── BRANCHES ──────────────────────────────────────────────────
  /branches:
    get:
      operationId: listBranches
      tags: [branches]
      summary: List branches
      parameters:
        - name: is_active
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Branches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Branch"
    post:
      operationId: createBranch
      tags: [branches]
      summary: Create branch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BranchInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Branch"

  /branches/{branch_id}:
    get:
      operationId: getBranch
      tags: [branches]
      summary: Get branch
      parameters:
        - name: branch_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Branch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Branch"

  /branches/{branch_id}/dashboard:
    get:
      operationId: getBranchDashboard
      tags: [branches]
      summary: Get branch dashboard KPIs
      parameters:
        - name: branch_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Dashboard KPIs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BranchDashboard"

  /branches/{branch_id}/stock-summary:
    get:
      operationId: getBranchStockSummary
      tags: [branches]
      summary: Get branch stock summary
      parameters:
        - name: branch_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Stock summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BranchStockSummary"

  # ── MEDICINES ──────────────────────────────────────────────────
  /medicines:
    get:
      operationId: listMedicines
      tags: [medicines]
      summary: List medicines
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
        - name: category
          in: query
          schema:
            type: string
        - name: manufacturer
          in: query
          schema:
            type: string
        - name: requires_prescription
          in: query
          schema:
            type: boolean
        - name: is_active
          in: query
          schema:
            type: boolean
        - name: sort_by
          in: query
          schema:
            type: string
        - name: sort_order
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Paginated medicines
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MedicineListResponse"
    post:
      operationId: createMedicine
      tags: [medicines]
      summary: Create medicine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MedicineInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Medicine"

  /medicines/search:
    get:
      operationId: searchMedicines
      tags: [medicines]
      summary: Search medicines
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: barcode
          in: query
          schema:
            type: string
        - name: branch_id
          in: query
          schema:
            type: string
        - name: in_stock_only
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Medicine"

  /medicines/low-stock:
    get:
      operationId: getLowStockMedicines
      tags: [medicines]
      summary: Get low-stock medicines
      parameters:
        - name: branch_id
          in: query
          schema:
            type: string
        - name: threshold
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Low stock medicines
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LowStockMedicine"

  /medicines/expiring-soon:
    get:
      operationId: getExpiringMedicines
      tags: [medicines]
      summary: Get expiring-soon medicines
      parameters:
        - name: days
          in: query
          schema:
            type: integer
            default: 90
        - name: branch_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Expiring medicines
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExpiringMedicine"

  /medicines/categories:
    get:
      operationId: getMedicineCategories
      tags: [medicines]
      summary: Get medicine categories
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MedicineCategory"

  /medicines/{medicine_id}:
    get:
      operationId: getMedicine
      tags: [medicines]
      summary: Get medicine detail
      parameters:
        - name: medicine_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Medicine
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Medicine"
    put:
      operationId: updateMedicine
      tags: [medicines]
      summary: Update medicine
      parameters:
        - name: medicine_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MedicineUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Medicine"
    delete:
      operationId: deactivateMedicine
      tags: [medicines]
      summary: Deactivate medicine
      parameters:
        - name: medicine_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deactivated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  # ── INVENTORY ──────────────────────────────────────────────────
  /inventory:
    get:
      operationId: getInventoryOverview
      tags: [inventory]
      summary: Get inventory overview
      parameters:
        - name: branch_id
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Inventory overview
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryItem"

  /inventory/batches:
    get:
      operationId: listBatches
      tags: [inventory]
      summary: List batches
      parameters:
        - name: medicine_id
          in: query
          schema:
            type: string
        - name: branch_id
          in: query
          schema:
            type: string
        - name: has_stock
          in: query
          schema:
            type: boolean
        - name: page
          in: query
          schema:
            type: integer
            default: 1
      responses:
        "200":
          description: Batches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchListResponse"
    post:
      operationId: createBatch
      tags: [inventory]
      summary: Create batch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Batch"

  /inventory/adjustments:
    post:
      operationId: createStockAdjustment
      tags: [inventory]
      summary: Create stock adjustment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockAdjustmentInput"
      responses:
        "201":
          description: Adjustment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockAdjustment"
    get:
      operationId: listStockAdjustments
      tags: [inventory]
      summary: List stock adjustments
      parameters:
        - name: branch_id
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
      responses:
        "200":
          description: Adjustments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StockAdjustment"

  /inventory/valuation:
    get:
      operationId: getStockValuation
      tags: [inventory]
      summary: Get stock valuation
      parameters:
        - name: branch_id
          in: query
          schema:
            type: string
        - name: method
          in: query
          schema:
            type: string
            default: fifo
      responses:
        "200":
          description: Valuation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockValuation"

  /inventory/reorder-suggestions:
    get:
      operationId: getReorderSuggestions
      tags: [inventory]
      summary: Get reorder suggestions
      parameters:
        - name: branch_id
          in: query
          schema:
            type: string
        - name: days_cover
          in: query
          schema:
            type: integer
            default: 30
      responses:
        "200":
          description: Reorder suggestions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReorderSuggestion"

  # ── PATIENTS ──────────────────────────────────────────────────
  /patients:
    get:
      operationId: listPatients
      tags: [patients]
      summary: List patients
      parameters:
        - name: customer_type
          in: query
          schema:
            type: string
        - name: branch_id
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Patients
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientListResponse"
    post:
      operationId: createPatient
      tags: [patients]
      summary: Create patient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatientInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"

  /patients/search:
    get:
      operationId: searchPatients
      tags: [patients]
      summary: Search patients
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: cnic
          in: query
          schema:
            type: string
        - name: phone
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Patient"

  /patients/{patient_id}:
    get:
      operationId: getPatient
      tags: [patients]
      summary: Get patient
      parameters:
        - name: patient_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Patient
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"
    put:
      operationId: updatePatient
      tags: [patients]
      summary: Update patient
      parameters:
        - name: patient_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatientUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"

  /patients/{patient_id}/history:
    get:
      operationId: getPatientHistory
      tags: [patients]
      summary: Get patient purchase history
      parameters:
        - name: patient_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Purchase history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Sale"

  # ── PRESCRIPTIONS ──────────────────────────────────────────────────
  /prescriptions:
    get:
      operationId: listPrescriptions
      tags: [prescriptions]
      summary: List prescriptions
      parameters:
        - name: patient_id
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: branch_id
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
      responses:
        "200":
          description: Prescriptions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrescriptionListResponse"
    post:
      operationId: createPrescription
      tags: [prescriptions]
      summary: Create prescription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrescriptionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prescription"

  /prescriptions/{prescription_id}:
    get:
      operationId: getPrescription
      tags: [prescriptions]
      summary: Get prescription
      parameters:
        - name: prescription_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Prescription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prescription"

  /prescriptions/{prescription_id}/verify:
    post:
      operationId: verifyPrescription
      tags: [prescriptions]
      summary: Verify prescription
      parameters:
        - name: prescription_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrescriptionVerifyInput"
      responses:
        "200":
          description: Verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prescription"

  /prescriptions/{prescription_id}/dispense:
    post:
      operationId: dispensePrescription
      tags: [prescriptions]
      summary: Mark prescription as dispensed
      parameters:
        - name: prescription_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrescriptionDispenseInput"
      responses:
        "200":
          description: Dispensed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prescription"

  /prescriptions/stats:
    get:
      operationId: getPrescriptionStats
      tags: [prescriptions]
      summary: Get prescription statistics
      parameters:
        - name: branch_id
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
        - name: to
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrescriptionStats"

  # ── SALES ──────────────────────────────────────────────────
  /sales:
    post:
      operationId: createSale
      tags: [sales]
      summary: Create sale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaleInput"
      responses:
        "201":
          description: Sale created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaleResponse"
    get:
      operationId: listSales
      tags: [sales]
      summary: List sales
      parameters:
        - name: from
          in: query
          schema:
            type: string
        - name: to
          in: query
          schema:
            type: string
        - name: branch_id
          in: query
          schema:
            type: string
        - name: patient_id
          in: query
          schema:
            type: string
        - name: sale_type
          in: query
          schema:
            type: string
        - name: payment_method
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Sales
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaleListResponse"

  /sales/kpis:
    get:
      operationId: getSalesKpis
      tags: [sales]
      summary: Get sales KPIs
      parameters:
        - name: branch_id
          in: query
          schema:
            type: string
        - name: date
          in: query
          schema:
            type: string
      responses:
        "200":
          description: KPIs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesKpis"

  /sales/daily-summary:
    get:
      operationId: getDailySummary
      tags: [sales]
      summary: Get daily summary
      parameters:
        - name: branch_id
          in: query
          schema:
            type: string
        - name: date
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Daily summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailySummary"

  /sales/held:
    get:
      operationId: listHeldSales
      tags: [sales]
      summary: List held sales
      parameters:
        - name: branch_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Held sales
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Sale"

  /sales/calculate:
    post:
      operationId: calculateSale
      tags: [sales]
      summary: Calculate sale totals (dry-run)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaleInput"
      responses:
        "200":
          description: Calculation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaleCalculation"

  /sales/{sale_id}:
    get:
      operationId: getSale
      tags: [sales]
      summary: Get sale
      parameters:
        - name: sale_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Sale
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sale"

  /sales/{sale_id}/refund:
    post:
      operationId: refundSale
      tags: [sales]
      summary: Process refund
      parameters:
        - name: sale_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefundInput"
      responses:
        "200":
          description: Refund processed
          content:
            application/json:
