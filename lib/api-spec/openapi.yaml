components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    Pagination:
      type: object
      properties:
        page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        pages:
          type: integer
        has_next:
          type: boolean
        has_prev:
          type: boolean
      required:
        - page
        - per_page
        - total
        - pages
        - has_next
        - has_prev

    # ── AUTH ──────────────────────────────────────────────────
    LoginInput:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
        branch_id:
          type: ["string", "null"]
      required:
        - email
        - password

    LogoutInput:
      type: object
      properties:
        refresh_token:
          type: string
      required:
        - refresh_token

    AuthResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
        expires_in:
          type: integer
        user:
          $ref: "#/components/schemas/UserProfile"
      required:
        - access_token
        - refresh_token
        - token_type
        - expires_in
        - user

    UserProfile:
      type: object
